<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Umów lekcję — Edyta Brejda Mirga</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6fb;
      color: #202124;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 25px 18px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #666;
      font-size: 16px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 17px 0 7px;
    }

    label:first-child {
      margin-top: 0;
    }

    input,
    select {
      width: 100%;
      padding: 15px;
      border: 1px solid #cfd4dc;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #3578e5;
      box-shadow: 0 0 0 3px rgba(53,120,229,0.12);
    }

    .slot {
      border: 1px solid #d8dde7;
      border-radius: 14px;
      padding: 16px;
      margin-top: 10px;
      cursor: pointer;
      transition: 0.2s;
      background: white;
    }

    .slot:hover {
      border-color: #3578e5;
    }

    .slot.selected {
      border: 2px solid #3578e5;
      background: #f1f6ff;
    }

    .slot-date {
      font-weight: 700;
      font-size: 17px;
    }

    .slot-time {
      margin-top: 5px;
      color: #555;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: none;
      border-radius: 13px;
      background: #3578e5;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      display: none;
      text-align: center;
    }

    .success {
      background: #e8f7ed;
      color: #187a36;
    }

    .error {
      background: #fdecec;
      color: #b42318;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 20px 0;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px 0;
    }

    .required {
      color: #d93025;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Umów lekcję</h1>
    <p>Edyta Brejda Mirga — korepetycje online</p>
  </div>

  <!-- DANE UCZNIA -->
  <div class="card">

    <label>
      Imię i nazwisko <span class="required">*</span>
    </label>

    <input
      type="text"
      id="student_name"
      placeholder="Wpisz imię i nazwisko"
      autocomplete="name"
    >

    <label>
      Numer telefonu <span class="required">*</span>
    </label>

    <input
      type="tel"
      id="phone"
      placeholder="Wpisz numer telefonu"
      autocomplete="tel"
    >

    <label>
      Przedmiot <span class="required">*</span>
    </label>

    <select id="subject">
      <option value="">Wybierz przedmiot</option>
      <option value="Matematyka">Matematyka</option>
      <option value="Fizyka">Fizyka</option>
      <option value="Chemia">Chemia</option>
      <option value="Statystyka">Statystyka</option>
    </select>

    <label>
      Szkoła / klasa <span class="required">*</span>
    </label>

    <input
      type="text"
      id="school_class"
      placeholder="Np. SP 8, klasa 8"
    >

  </div>


  <!-- WOLNE TERMINY -->
  <div class="card">

    <h2 style="margin-top:0;">Wybierz termin</h2>

    <div id="slots">
      <div class="loading">
        Ładowanie dostępnych terminów...
      </div>
    </div>

  </div>


  <!-- PRZYCISK -->
  <div class="card">

    <button id="submitButton" disabled>
      Zarezerwuj lekcję
    </button>

    <div id="message" class="message"></div>

  </div>

</div>


<script>

  /* ==========================================
     SUPABASE
     ========================================== */

  const SUPABASE_URL =
    "https://oiymjjexygylafgdmecs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_bElEGtk1Q-JM1R1-F4c8Tg_gJ5-fyKy";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     ZMIENNE
     ========================================== */

  let selectedLesson = null;


  /* ==========================================
     POBIERANIE WOLNYCH TERMINÓW
     ========================================== */

  async function loadAvailableLessons() {

    const slotsContainer =
      document.getElementById("slots");

    slotsContainer.innerHTML =
      '<div class="loading">Ładowanie dostępnych terminów...</div>';

    const { data, error } =
      await supabaseClient
        .from("available_lessons")
        .select("lesson_date,start_time,end_time")
        .order("lesson_date", { ascending: true })
        .order("start_time", { ascending: true });

    if (error) {

      console.error(error);

      slotsContainer.innerHTML =
        '<div class="empty">Nie udało się pobrać terminów.</div>';

      return;
    }


    if (!data || data.length === 0) {

      slotsContainer.innerHTML =
        '<div class="empty">Obecnie brak dostępnych terminów.</div>';

      return;
    }


    slotsContainer.innerHTML = "";


    data.forEach((lesson, index) => {

      const div = document.createElement("div");

      div.className = "slot";

      div.dataset.index = index;


      const date = new Date(
        lesson.lesson_date + "T00:00:00"
      );


      const formattedDate =
        date.toLocaleDateString("pl-PL", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });


      div.innerHTML = `
        <div class="slot-date">
          ${formattedDate}
        </div>

        <div class="slot-time">
          ${lesson.start_time.substring(0,5)}
          –
          ${lesson.end_time.substring(0,5)}
        </div>
      `;


      div.addEventListener("click", () => {

        document
          .querySelectorAll(".slot")
          .forEach(slot =>
            slot.classList.remove("selected")
          );

        div.classList.add("selected");

        selectedLesson = lesson;

        checkForm();

      });


      slotsContainer.appendChild(div);

    });

  }


  /* ==========================================
     SPRAWDZANIE FORMULARZA
     ========================================== */

  function checkForm() {

    const name =
      document.getElementById("student_name").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const subject =
      document.getElementById("subject").value;

    const schoolClass =
      document.getElementById("school_class").value.trim();


    const ready =
      name &&
      phone &&
      subject &&
      schoolClass &&
      selectedLesson;


    document.getElementById("submitButton").disabled =
      !ready;

  }


  document
    .getElementById("student_name")
    .addEventListener("input", checkForm);

  document
    .getElementById("phone")
    .addEventListener("input", checkForm);

  document
    .getElementById("subject")
    .addEventListener("change", checkForm);

  document
    .getElementById("school_class")
    .addEventListener("input", checkForm);


  /* ==========================================
     REZERWACJA
     ========================================== */

  document
    .getElementById("submitButton")
    .addEventListener("click", async () => {

      const button =
        document.getElementById("submitButton");

      const message =
        document.getElementById("message");


      const studentName =
        document
          .getElementById("student_name")
          .value
          .trim();

      const phone =
        document
          .getElementById("phone")
          .value
          .trim();

      const subject =
        document
          .getElementById("subject")
          .value;

      const schoolClass =
        document
          .getElementById("school_class")
          .value
          .trim();


      if (
        !studentName ||
        !phone ||
        !subject ||
        !schoolClass ||
        !selectedLesson
      ) {

        showMessage(
          "Uzupełnij wszystkie pola i wybierz termin.",
          "error"
        );

        return;
      }


      button.disabled = true;

      button.textContent =
        "Rezerwowanie...";


      /*
       * Zapisujemy tylko dane, które powinien
       * podać uczeń.
       */

      const newLesson = {

        lesson_date:
          selectedLesson.lesson_date,

        start_time:
          selectedLesson.start_time,

        end_time:
          selectedLesson.end_time,

        student_name:
          studentName,

        phone:
          phone,

        school_class:
          schoolClass,

        subject:
          subject,

        lesson_type:
          "online",

        paid:
          false,

        cancelled:
          false,

        remote_booking:
          true

      };


      const { error } =
        await supabaseClient
          .from("lessons")
          .insert([newLesson]);


      if (error) {

        console.error(error);

        showMessage(
          "Nie udało się zarezerwować terminu. Spróbuj ponownie.",
          "error"
        );

        button.disabled = false;

        button.textContent =
          "Zarezerwuj lekcję";

        return;
      }


      showMessage(
        "Termin został zarezerwowany. Dziękuję! Skontaktuję się z Tobą.",
        "success"
      );


      button.textContent =
        "Lekcja zarezerwowana";


      selectedLesson = null;


      document
        .querySelectorAll(".slot")
        .forEach(slot =>
          slot.classList.remove("selected")
        );


      document
        .getElementById("student_name")
        .value = "";

      document
        .getElementById("phone")
        .value = "";

      document
        .getElementById("subject")
        .value = "";

      document
        .getElementById("school_class")
        .value = "";


      /*
       * Po rezerwacji odświeżamy listę terminów.
       */

      await loadAvailableLessons();

    });


  /* ==========================================
     KOMUNIKAT
     ========================================== */

  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display =
      "block";

  }


  /* ==========================================
     START
     ========================================== */

  loadAvailableLessons();

</script>

</body>
</html>
